name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  install-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install degen-cli
        run: pip install .

      - name: Verify CLI is callable
        run: degen --version

      - name: Verify subcommand version
        run: degen version

      - name: Verify help output
        run: degen --help

      - name: Verify package metadata
        run: python -c "from importlib.metadata import version; print(version('degen-cli'))"
