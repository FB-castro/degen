site_name: DEGEN
site_description: The Data Engineering Framework — scaffold, run, and learn production-ready pipelines in minutes
site_url: https://fb-castro.github.io/degen
repo_url: https://github.com/FB-castro/degen
repo_name: FB-castro/degen
edit_uri: ""

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial:
      - tutorial/index.md
      - "1. Init & Install": tutorial/01-init.md
      - "2. Start Services": tutorial/02-docker.md
      - "3. Create the DAG": tutorial/03-airflow-dag.md
      - "4. PySpark Transform": tutorial/04-pyspark.md
      - "5. dbt Models": tutorial/05-dbt-models.md
      - "6. Run End-to-End": tutorial/06-run.md
  - Patterns:
      - Batch ETL: patterns/batch-etl.md
      - Analytics: patterns/analytics.md
      - Streaming: patterns/streaming.md
  - CLI Reference: cli-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FB-castro/degen
      name: DEGEN on GitHub
  generator: false
